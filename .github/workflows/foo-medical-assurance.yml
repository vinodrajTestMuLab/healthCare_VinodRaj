name: Foo Medical - Kane CLI Assurance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  healthcare-assurance:
    name: Generate, run and prove Foo Medical
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---------------------------------------------------------
      # 3. Install Kane CLI
      # ---------------------------------------------------------
      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Install Kane skill
        run: kane-cli install skill

      - name: Verify Kane CLI
        run: |
          node --version
          kane-cli --version

      # ---------------------------------------------------------
      # 4. Authenticate Kane CLI with TestMu AI
      # ---------------------------------------------------------
      - name: Authenticate with TestMu AI
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          kane-cli login \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY"

      # ---------------------------------------------------------
      # 5. Ingest Foo Medical product PRD
      # ---------------------------------------------------------
      - name: Ingest Foo Medical PRD
        run: |
          kane-cli context ingest \
            ./requirements/foo-medical-prd.md \
            --as foo-medical-prd \
            --mode override

      # ---------------------------------------------------------
      # 6. Extract use cases
      # ---------------------------------------------------------
      - name: Extract Foo Medical use cases
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .artifacts

          kane-cli context list \
            --type usecase \
            --inferred \
            --json | tee .artifacts/usecases.ndjson

      # ---------------------------------------------------------
      # 7. Design tests from extracted use cases
      # ---------------------------------------------------------
      - name: Design Foo Medical tests
        shell: bash
        run: |
          set -euo pipefail

          ids=$(
            grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' \
              .artifacts/usecases.ndjson \
              | sed -E 's/.*"id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/' \
              | sort -u
          )

          if [ -z "$ids" ]; then
            echo "No use cases were extracted from the Foo Medical PRD."
            exit 1
          fi

          echo "Use cases to design:"
          printf '%s\n' "$ids"

          while IFS= read -r id; do
            [ -z "$id" ] && continue

            echo ""
            echo "============================================================"
            echo "Designing tests for use case: $id"
            echo "============================================================"

            kane-cli design tests \
              --use-case "$id" \
              --max 8 \
              --allow-unreviewed \
              --mode override

          done <<< "$ids"

      # ---------------------------------------------------------
      # 8. Show generated test files
      # ---------------------------------------------------------
      - name: List generated Foo Medical tests
        run: |
          kane-cli testmd list

      - name: Verify generated tests
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' tests < <(
            find .testmuai/tests \
              -type f \
              -name '*_test.md' \
              -print0
          )

          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No generated *_test.md files were found."
            exit 1
          fi

          echo "Generated ${#tests[@]} test(s):"

          for test_file in "${tests[@]}"; do
            echo " - $test_file"
          done

      # ---------------------------------------------------------
      # 9. Create Foo Medical runtime variables
      #
      # These values come from GitHub Secrets.
      # DO NOT hard-code patient credentials.
      # ---------------------------------------------------------
      - name: Create Foo Medical runtime variables
        env:
          FOO_MEDICAL_EMAIL: ${{ secrets.FOO_MEDICAL_EMAIL }}
          FOO_MEDICAL_PASSWORD: ${{ secrets.FOO_MEDICAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$FOO_MEDICAL_EMAIL" ]; then
            echo "FOO_MEDICAL_EMAIL GitHub Secret is not configured."
            exit 1
          fi

          if [ -z "$FOO_MEDICAL_PASSWORD" ]; then
            echo "FOO_MEDICAL_PASSWORD GitHub Secret is not configured."
            exit 1
          fi

          mkdir -p .testmuai/variables

          cat > .testmuai/variables/assurance.json <<EOF
          {
            "valid_login_email": {
              "value": "$FOO_MEDICAL_EMAIL"
            },
            "valid_login_username": {
              "value": "$FOO_MEDICAL_EMAIL"
            },
            "valid_login_password": {
              "value": "$FOO_MEDICAL_PASSWORD",
              "secret": true
            },
            "portal_login_url": {
              "value": "https://foomedical.com/"
            },
            "protected_page_url": {
              "value": "https://foomedical.com/"
            }
          }
          EOF

          echo "Kane runtime variables created."

      # ---------------------------------------------------------
      # 10. Author generated tests
      #
      # This establishes the browser recording for generated
      # tests before they are replayed through testrun.
      # ---------------------------------------------------------
      - name: Author generated Foo Medical tests
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' test_file; do

            echo ""
            echo "============================================================"
            echo "Authoring: $test_file"
            echo "============================================================"

            kane-cli testmd run "$test_file" \
              --agent \
              --headless \
              --author \
              --url "https://foomedical.com/" \
              --on-lock-conflict wait

          done < <(
            find .testmuai/tests \
              -type f \
              -name '*_test.md' \
              -print0
          )

      # ---------------------------------------------------------
      # 11. Run complete Foo Medical suite
      # ---------------------------------------------------------
      - name: Run Foo Medical assurance suite
        run: |
          kane-cli testrun run \
            --headless \
            --parallel 2 \
            --on-failure fail-fast \
            --variables-file .testmuai/variables/assurance.json

      # ---------------------------------------------------------
      # 12. Show evidence
      # ---------------------------------------------------------
      - name: Show evidence files
        if: always()
        shell: bash
        run: |
          echo "Evidence generated under .testmuai/evidence/"

          find .testmuai/evidence \
            -maxdepth 2 \
            -type f \
            -print 2>/dev/null || true

      # ---------------------------------------------------------
      # 13. Validate evidence packs
      # ---------------------------------------------------------
      - name: Validate evidence packs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          packs=(.testmuai/evidence/*.evidence)

          if [ ${#packs[@]} -eq 0 ]; then
            echo "No .evidence pack was generated."
            exit 1
          fi

          validation_failed=0

          for pack in "${packs[@]}"; do
            echo ""
            echo "============================================================"
            echo "Validating evidence pack: $pack"
            echo "============================================================"

            if ! kane-cli evidence validate "$pack" --json; then
              validation_failed=1
            fi
          done

          if [ "$validation_failed" -ne 0 ]; then
            echo "One or more evidence packs failed validation."
            exit 1
          fi

          echo "All evidence packs passed validation."

      # ---------------------------------------------------------
      # 14. Generate assurance coverage
      # ---------------------------------------------------------
      - name: Generate Foo Medical assurance coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .artifacts

          kane-cli cover --json \
            | tee .artifacts/coverage.json

      # ---------------------------------------------------------
      # 15. Upload Kane CLI artifacts
      # ---------------------------------------------------------
      - name: Upload Kane CLI assurance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foo-medical-kane-cli-assurance
          path: |
            .artifacts/
            .context/
            .testmuai/tests/
            .testmuai/variables/
            .testmuai/evidence/
            tests/**/Result.md
            tests/**/output-*/
          if-no-files-found: warn
          retention-days: 14
